# Workflow to automatically create release PRs from develop to main
name: Create Release PR

on:
    push:
        branches:
            - copilot/sub-pr-2

jobs:
    create-release-pr:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get commits
              id: commits
              run: |
                  COMMITS=$(git log origin/main..origin/develop --pretty=format:"- %s (%h)" --reverse)
                  echo "list<<EOF" >> $GITHUB_OUTPUT
                  echo "$COMMITS" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Ensure Pull Request to main exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  # Check if a PR from develop to main already exists
                  EXISTING_PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

                  if [ -n "$EXISTING_PR" ]; then
                    echo "An open PR from develop to main already exists: #$EXISTING_PR"
                    exit 0
                  fi

                  TITLE="prdリリース"
                  BODY=$(cat <<EOF
                  ## 変更内容
                  ${{ steps.commits.outputs.list }}
                  EOF
                  )

                  gh pr create \
                    --base main \
                    --head develop \
                    --title "$TITLE" \
                    --body "$BODY"
