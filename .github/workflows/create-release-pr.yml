name: Create Release PR

on:
    push:
        branches:
            - develop

jobs:
    create-release-pr:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check for code changes
              id: changes
              run: |
                  git fetch origin main
                  # コミット数ではなく、実際のコード差分をチェック
                  DIFF=$(git diff origin/main..HEAD --stat)
                  if [ -z "$DIFF" ]; then
                    echo "No code changes between main and develop. Skipping."
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                  else
                    echo "Code changes found:"
                    echo "$DIFF"
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                  fi

            - name: Get commits
              if: steps.changes.outputs.has_changes == 'true'
              id: commits
              run: |
                  COMMITS=$(git log origin/main..HEAD --pretty=format:"- %s (%h)" --reverse)
                  echo "list<<EOF" >> $GITHUB_OUTPUT
                  echo "$COMMITS" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Ensure Pull Request to main exists
              if: steps.changes.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e

                  TITLE="prdリリース"
                  BODY=$(cat <<EOF
                  ## 変更内容
                  ${{ steps.commits.outputs.list }}
                  EOF
                  )

                  # Check if a PR from develop to main already exists
                  EXISTING_PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

                  if [ -n "$EXISTING_PR" ]; then
                    echo "An open PR from develop to main already exists: #$EXISTING_PR"
                    echo "Updating PR body..."
                    gh pr edit "$EXISTING_PR" --body "$BODY"
                    echo "PR #$EXISTING_PR updated successfully"
                  else
                    echo "Creating new PR..."
                    gh pr create \
                      --base main \
                      --head develop \
                      --title "$TITLE" \
                      --body "$BODY"
                    echo "PR created successfully"
                  fi
